services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    ports: ["8761:8761"]

  user-service:
    build: { context: ., args: { MODULE: user-service } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-32b}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  post-service:
    build: { context: ., args: { MODULE: post-service } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/postdb
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-32b}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-32b}
    depends_on: [discovery-server]

volumes:
  pgdata:
