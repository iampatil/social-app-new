server:
  port: 8081
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: change-me-change-me-change-me-change-me-32b
  ttl-ms: 86400000
app:
  admin:
    username: admin
    password: Admin@12345
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
